name: Validate Ava Screening app

on:
  pull_request:
    paths:
      - 'src/pages/AvaScreening.*'
      - 'src/utils/avaCamera.ts'
      - 'src/utils/avaProctorMedia.ts'
      - 'tests/avaCaptureRecovery.test.mjs'
      - 'public/_headers'
      - 'tests/avaCameraBrowser.test.mjs'
      - 'src/pages/RecruitmentAdmin.*'
      - 'src/site/Layout.tsx'
      - 'src/site/CookieNotice.tsx'
      - 'src/App.tsx'
      - 'functions/api/ava-screening.ts'
      - 'functions/api/ava-identity-callback.ts'
      - 'functions/api/ava-identity-link.ts'
      - 'functions/lib/avaVeriff.ts'
      - 'functions/lib/avaAccess.ts'
      - 'tests/avaMobileIdentityProctor.test.mjs'
      - 'tests/avaVeriff.test.mjs'
      - 'src/site/content/legal/privacy.ts'
      - 'docs/AVA-SCREENING.md'
      - 'AVA-INSTRUCTIONS/LEGAL/privacy-policy.md'
      - '.env.example'
      - 'functions/recruitment-admin/**'
      - 'public/media/ava-assessment-*.svg'
      - 'db/submissions.sql'
      - 'wrangler.jsonc'
      - 'tests/avaProductionSmoke.mjs'
      - 'functions/lib/avaOwnedIdentity.ts'
      - 'tests/avaOwnedIdentity.test.mjs'
      - 'prompts/**'
      - 'tests/avaV3Contracts.test.mjs'
      - 'tests/avaHorizontalFlow.test.mjs'
      - 'tests/avaViewportProctor.test.mjs'
      - 'index.html'
      - 'public/media/ava-proctor-mermaid.svg'
      - '.github/workflows/validate-ava-screening.yml'
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'src/pages/AvaScreening.*'
      - 'src/utils/avaCamera.ts'
      - 'src/utils/avaProctorMedia.ts'
      - 'tests/avaCaptureRecovery.test.mjs'
      - 'public/_headers'
      - 'tests/avaCameraBrowser.test.mjs'
      - 'src/pages/RecruitmentAdmin.*'
      - 'functions/api/ava-screening.ts'
      - 'functions/api/ava-identity-callback.ts'
      - 'functions/api/ava-identity-link.ts'
      - 'functions/lib/avaVeriff.ts'
      - 'functions/recruitment-admin/**'
      - 'tests/avaProductionSmoke.mjs'
      - 'tests/avaMobileIdentityProctor.test.mjs'
      - 'tests/avaVeriff.test.mjs'
      - 'src/site/content/legal/privacy.ts'
      - 'docs/AVA-SCREENING.md'
      - '.env.example'
      - '.github/workflows/validate-ava-screening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without creating a lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Build Cloudflare Pages frontend
        run: npm run build:pages
      - name: AVA portal security and feature regression contracts
        run: node --experimental-strip-types --test tests/avaV3Contracts.test.mjs tests/avaHorizontalFlow.test.mjs tests/avaViewportProctor.test.mjs tests/avaOwnedIdentity.test.mjs tests/avaCameraBrowser.test.mjs tests/avaCaptureRecovery.test.mjs tests/avaMobileIdentityProctor.test.mjs tests/avaVeriff.test.mjs
      - name: Non-invasive production Ava API smoke
        if: github.event_name != 'pull_request'
        run: node tests/avaProductionSmoke.mjs
