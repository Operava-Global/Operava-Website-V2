name: Deploy OPERAVA Website V2 (Business Cloudflare only)
on:
  push:
    branches: [main]
    paths:
      - 'src/pages/Home.tsx'
      - 'src/components/ui/display-cards.tsx'
      - 'public/media/services/**'
      - 'wrangler.jsonc'
      - 'db/submissions.sql'
      - '.github/workflows/deploy-operava-business-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operava-business-pages-v2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: d33b1b4666f334f763903c86728a3e74
      CLOUDFLARE_API_TOKEN: ${{ secrets.OPERAVA_BUSINESS_CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment target
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::OPERAVA_BUSINESS_CF_API_TOKEN is missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "d33b1b4666f334f763903c86728a3e74"
          node -e 'const c=JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8"));if(c.name!=="operava-website-v2"||c.d1_databases[0].database_id!=="19f8a477-6369-49de-bb25-2c9358820757")process.exit(1)'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Build Pages assets
        run: npm run build:pages
      - name: Apply idempotent database schema
        run: npx wrangler@4 d1 execute operava-submissions --remote --file=db/submissions.sql
      - name: Deploy Website V2
        run: npx wrangler@4 pages deploy dist --project-name=operava-website-v2 --branch=main
