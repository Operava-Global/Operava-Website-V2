<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 470" role="img" aria-labelledby="title desc">
<title id="title">AVA, the animated assessment guide</title><desc id="desc">Friendly turquoise cyber-mermaid with gently swaying circuit-patterned tail.</desc>
<style>
@keyframes ava-tail-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes ava-spark{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes ava-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#mermaid{animation:ava-float 5.5s ease-in-out infinite;transform-origin:50% 35%}
#tail{animation:ava-tail-sway 5.8s ease-in-out infinite;transform-origin:150px 241px}
.spark{animation:ava-spark 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){#mermaid,#tail,.spark{animation:none!important}}
</style>
<defs>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3f4ff"/><stop offset=".48" stop-color="#17aaca"/><stop offset="1" stop-color="#007caa"/></linearGradient>
<linearGradient id="fin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54f8ff"/><stop offset="1" stop-color="#0284ab"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6cecff"/><stop offset="1" stop-color="#1a80b6"/></linearGradient>
<pattern id="hex" width="17" height="20" patternUnits="userSpaceOnUse"><path d="M8.5 1 16 5.5v9L8.5 19 1 14.5v-9z" fill="none" stroke="#c4faff" stroke-opacity=".5" stroke-width="1.1"/></pattern>
</defs>
