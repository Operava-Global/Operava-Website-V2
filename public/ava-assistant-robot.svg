<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-label="Premium AI assistant robot head">
  <defs>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E2FF"/>
      <stop offset="0.55" stop-color="#C9B8FF"/>
      <stop offset="1" stop-color="#9A6CFF"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B0FBF"/>
      <stop offset="1" stop-color="#22007A"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9A8FF"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="eyeClip"><circle cx="160" cy="186" r="52"/></clipPath>
    <style>
      .float { animation: floatY 3.2s ease-in-out infinite; transform-origin: 160px 170px; }
      .antenna-ball { animation: ballPulse 2.2s ease-in-out infinite; transform-origin: 160px 32px; }
      .glow { animation: glowPulse 2.2s ease-in-out infinite; transform-origin: 160px 32px; }
      .stripes { animation: stripeSlide 2.8s ease-in-out infinite; }
      .eye { animation: eyeBlink 4.5s ease-in-out infinite; transform-origin: 160px 186px; }
      .shadow { animation: shadowPulse 3.2s ease-in-out infinite; transform-origin: 160px 302px; }
      @keyframes floatY { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
      @keyframes ballPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
      @keyframes glowPulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: .85; transform: scale(1.25); } }
      @keyframes stripeSlide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
      @keyframes eyeBlink { 0%,88%,100% { transform: scaleY(1); } 92% { transform: scaleY(.12); } }
      @keyframes shadowPulse { 0%,100% { transform: scaleX(1); opacity:.28; } 50% { transform: scaleX(.72); opacity:.14; } }
      @media (prefers-reduced-motion: reduce) { .float,.antenna-ball,.glow,.stripes,.eye,.shadow { animation: none; } }
    </style>
  </defs>
  <ellipse class="shadow" cx="160" cy="302" rx="82" ry="10" fill="#6D28D9"/>
  <g class="float">
    <circle class="glow" cx="160" cy="32" r="30" fill="url(#glowGrad)"/>
    <rect x="153" y="52" width="14" height="26" rx="7" fill="#2E0A9E"/>
    <circle cx="160" cy="70" r="18" fill="#2E0A9E" opacity="0.25"/>
    <circle class="antenna-ball" cx="160" cy="32" r="22" fill="url(#ballGrad)"/>
    <ellipse cx="152" cy="24" rx="7" ry="5" fill="#fff" opacity="0.55"/>
    <ellipse cx="34" cy="186" rx="24" ry="52" fill="#4C1DDB"/>
    <ellipse cx="286" cy="186" rx="24" ry="52" fill="#4C1DDB"/>
    <rect x="28" y="72" width="264" height="212" rx="72" fill="url(#headGrad)"/>
    <rect x="28" y="72" width="264" height="212" rx="72" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="56" y="102" width="208" height="152" rx="48" fill="url(#faceGrad)"/>
    <rect x="56" y="102" width="208" height="152" rx="48" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
    <g class="eye">
      <circle cx="160" cy="186" r="52" fill="#F3EEFF"/>
      <g class="stripes" clip-path="url(#eyeClip)">
        <rect x="88" y="146" width="150" height="10" fill="#3B0FBF" transform="rotate(-18 160 186)"/>
        <rect x="88" y="178" width="150" height="10" fill="#3B0FBF" transform="rotate(-18 160 186)"/>
        <rect x="88" y="210" width="150" height="10" fill="#3B0FBF" transform="rotate(-18 160 186)"/>
        <circle cx="160" cy="186" r="52" fill="none" stroke="#fff" stroke-opacity="0.2"/>
      </g>
    </g>
    <path d="M62 118 Q62 102 78 102 L112 102" stroke="#fff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>