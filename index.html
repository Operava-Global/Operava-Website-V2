<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // The applicant assessment opens in white regardless of the marketing-site preference.
      // This does not overwrite the visitor's saved website theme.
      (function () {
        var ava = /^\/(?:ava-screening|applicant-portal)(?:\/|$)/.test(location.pathname);
        var preferred = 'dark';
        try { preferred = localStorage.getItem('operava-theme') === 'light' ? 'light' : 'dark'; } catch (_) {}
        var current = ava ? 'light' : preferred;
        document.documentElement.dataset.theme = current;
        document.documentElement.style.colorScheme = current;
      }());
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <title>OPERAVA GLOBAL SOLUTIONS</title>
    <meta
      name="description"
      content="OPERAVA Global Solutions — Philippine-based technology, workforce and business process outsourcing company. IT services, BPO, automation and remote teams, operating remotely and globally."
    />
    <meta property="og:site_name" content="OPERAVA GLOBAL SOLUTIONS" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OPERAVA GLOBAL SOLUTIONS — Operating in Advance." />
    <meta property="og:image" content="https://ax-website-c4y.pages.dev/media/operava-team-collaboration.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />

      html,

        background: #1b1b21;
